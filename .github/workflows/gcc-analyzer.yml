---
name: 'GCC Analyzer'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  gcc-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc meson ninja-build \
            liburing-dev libnuma-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build with -fanalyzer
        run: |
          meson setup build-analyzer -Dc_args=-fanalyzer --buildtype=debug
          ninja -C build-analyzer
