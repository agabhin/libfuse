---
name: 'Clang Static Analyzer'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  scan-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools meson ninja-build \
            liburing-dev libnuma-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run scan-build
        run: |
          CC=ccc-analyzer CXX=c++-analyzer meson setup build-scan --buildtype=debug
          scan-build --status-bugs -o scan-results ninja -C build-scan
      - name: Upload scan-build report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-build-report
          path: scan-results/
